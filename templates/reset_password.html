{% extends 'base.html' %}
{% block title %}Restablecer contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 bg-white">
      <div class="text-center mb-3">
        <div class="metric-icon mx-auto mb-3"><i class="bi bi-key-fill"></i></div>
        <h1 class="h4 mb-1">Restablecer contraseña</h1>
        <p class="text-secondary small mb-0">Ingresa tu correo para recibir una nueva clave temporal.</p>
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-envelope me-1"></i>Correo electrónico</label>
          <input class="form-control" name="email" type="email" required autofocus>
        </div>
        <button class="btn btn-primary w-100"><i class="bi bi-send"></i>Enviar clave temporal</button>
        <div class="text-center mt-3"><a href="{{ url_for('login') }}" class="small">Volver al login</a></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
