{% extends 'base.html' %}
{% block title %}Editar proyecto{% endblock %}
{% block content %}
<div class="card p-4 bg-white">
  <h1 class="h4 mb-4">Editar proyecto</h1>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control" name="name" value="{{ project.name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea class="form-control" name="description" rows="4">{{ project.description or '' }}</textarea>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Guardar cambios</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('project_detail', project_id=project.id) }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
