{% extends 'base.html' %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 bg-white">
      <div class="text-center mb-3">
        <div class="metric-icon mx-auto mb-3"><i class="bi bi-shield-lock-fill"></i></div>
        <h1 class="h4 mb-1">Cambia tu contraseña</h1>
        <p class="text-secondary small mb-0">Este paso es obligatorio para continuar usando la plataforma.</p>
      </div>
      <form method="post">
        <div class="mb-3"><label class="form-label">Contraseña temporal / actual</label><input class="form-control" type="password" name="current_password" required autofocus></div>
        <div class="mb-3"><label class="form-label">Nueva contraseña</label><input class="form-control" type="password" name="new_password" minlength="8" required></div>
        <div class="mb-3"><label class="form-label">Confirmar nueva contraseña</label><input class="form-control" type="password" name="confirm_password" minlength="8" required></div>
        <button class="btn btn-primary w-100"><i class="bi bi-check2-circle"></i>Actualizar contraseña</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
